{% extends "theme_giscube/base_site.html" %}
{% load i18n static %}

{% block extrahead %}
{{block.super}}
<link rel="stylesheet" href="{% static 'admin.css' %}">
{% endblock extrahead %}

{% block messages %}
<ul class="messagelist">
    {% for message in messages %}
        <li class="{{ message.tags }}">{{ message|safe }}</li>
    {% endfor %}
</ul>
{% endblock %}
{% block nav-global %}{% endblock %}
